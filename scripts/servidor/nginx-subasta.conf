# nginx del servidor propio: /etc/nginx/sites-available/subasta
# Primero solo este bloque (puerto 80), después `certbot --nginx -d <dominio>`, que agrega el 443.
# Reemplazar DOMINIO por el definitivo (o el de sslip.io para probar). Sin default_server: en
# nginx 1.24 esa marca es del puerto entero y se la sacaría a otro proyecto.
server {
  listen 80;
  listen [::]:80;
  server_name DOMINIO;
  access_log /var/log/nginx/subasta.access.log;
  error_log /var/log/nginx/subasta.error.log;
  location / {
    proxy_pass http://127.0.0.1:3008;
  }
}

